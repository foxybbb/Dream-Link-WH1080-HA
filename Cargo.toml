[package]
name = "weather-station"
version = "0.1.0"
edition = "2021"

[dependencies]
rusb = "0.9"
chrono = { version = "0.4", features = ["serde"] }
libm = "0.2"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.0", features = ["v4"] } 